name: Atlas build

# Builds a self-contained Jellyfin server with jellyfin-web bundled in,
# for the Mac mini (osx-arm64) and Linux (linux-x64), and publishes a GitHub release.
#
# - Push a tag like atlas-v1.0.0: builds and makes a release named after the tag.
# - Run workflow (Actions tab): builds and makes a pre-release tagged atlas-build-<run number>.
#   Untick "Create a release" to only build.
# - Push to an atlas/* branch: builds only (artifacts on the run), no release.
on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "jellyfin-web branch or tag to bundle"
        required: false
        default: "master"
      release:
        description: "Create a release"
        type: boolean
        required: false
        default: true
  push:
    branches:
      - "atlas/**"
    tags:
      - "atlas-v*"

permissions:
  contents: read

env:
  SDK_VERSION: "10.0.x"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin-web
          ref: ${{ github.event.inputs.web_ref || 'master' }}
          path: web

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build jellyfin-web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:production

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web
          path: web/dist
          retention-days: 1

  server:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: ["osx-arm64", "linux-x64"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Test Atlas segment math
        run: dotnet test tests/Jellyfin.Api.Tests --configuration Release --filter AtlasSegmentGrid --verbosity minimal

      - name: Publish server
        run: >
          dotnet publish Jellyfin.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:DebugSymbols=false
          -p:DebugType=none
          --output out/jellyfin

      - uses: actions/download-artifact@v4
        with:
          name: jellyfin-web
          path: out/jellyfin/jellyfin-web

      # tar keeps the executable bit, a plain artifact zip doesn't.
      - name: Package
        run: |
          echo "${GITHUB_SHA::7}" > out/jellyfin/ATLAS_BUILD
          tar -czf jellyfin-atlas-${{ matrix.rid }}.tar.gz -C out jellyfin

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-atlas-${{ matrix.rid }}
          path: jellyfin-atlas-${{ matrix.rid }}.tar.gz
          retention-days: 14

  release:
    needs: server
    if: startsWith(github.ref, 'refs/tags/atlas-v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jellyfin-atlas-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_REF: ${{ github.event.inputs.web_ref || 'master' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            FLAGS=""
          else
            TAG="atlas-build-${GITHUB_RUN_NUMBER}"
            FLAGS="--prerelease --target ${GITHUB_SHA}"
          fi

          cat > notes.md <<NOTES
          Jellyfin server with Atlas ABR, jellyfin-web bundled.

          - Commit: ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}
          - jellyfin-web: ${WEB_REF}

          Mac mini: download jellyfin-atlas-osx-arm64.tar.gz, then
          \`tar -xzf jellyfin-atlas-osx-arm64.tar.gz && xattr -dr com.apple.quarantine jellyfin\`
          NOTES

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Atlas $TAG" \
            --notes-file notes.md \
            $FLAGS

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jellyfin-atlas-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          WEB_REF: ${{ github.event.inputs.web_ref || 'master' }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

          notes="Atlas build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME}), jellyfin-web ${WEB_REF}."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-running with the same tag replaces the files on the existing release.
            gh release upload "$TAG" *.tar.gz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" *.tar.gz SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Jellyfin Atlas $TAG" \
              --notes "$notes" \
              "${flags[@]}"
          fi