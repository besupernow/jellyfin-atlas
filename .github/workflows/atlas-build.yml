name: Build Atlas Server
run-name: ${{ inputs.release_tag != '' && format('Atlas server release {0}', inputs.release_tag) || format('Atlas server build {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a draft release (e.g. server-1.0.0); leave empty to only produce Actions artifacts
        default: ''
        type: string
      web_ref:
        description: jellyfin-web branch or tag to bundle (must match the server's version line)
        default: master
        type: string
      build_macos_arm64:
        description: macOS Apple silicon (Mac mini)
        default: true
        type: boolean
      build_macos_x64:
        description: macOS Intel
        default: false
        type: boolean
      build_linux_x64:
        description: Linux x64
        default: false
        type: boolean
      build_linux_arm64:
        description: Linux arm64
        default: false
        type: boolean
      build_windows_x64:
        description: Windows x64
        default: false
        type: boolean
      run_tests:
        description: Run the Atlas tests before building
        default: true
        type: boolean

env:
  SDK_VERSION: "10.0.x"
  NODE_VERSION: "24"

jobs:
  # Turns the checkboxes into the list of server builds.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - id: plan
        env:
          MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          MACOS_X64: ${{ inputs.build_macos_x64 }}
          LINUX_X64: ${{ inputs.build_linux_x64 }}
          LINUX_ARM64: ${{ inputs.build_linux_arm64 }}
          WINDOWS_X64: ${{ inputs.build_windows_x64 }}
        run: |
          targets=()
          [ "$MACOS_ARM64" = "true" ] && targets+=('{"rid":"osx-arm64","name":"macos-arm64"}')
          [ "$MACOS_X64" = "true" ]   && targets+=('{"rid":"osx-x64","name":"macos-x64"}')
          [ "$LINUX_X64" = "true" ]   && targets+=('{"rid":"linux-x64","name":"linux-x64"}')
          [ "$LINUX_ARM64" = "true" ] && targets+=('{"rid":"linux-arm64","name":"linux-arm64"}')
          [ "$WINDOWS_X64" = "true" ] && targets+=('{"rid":"win-x64","name":"windows-x64"}')
          joined=$(IFS=,; echo "${targets[*]}")
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          [ ${#targets[@]} -gt 0 ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  tests:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}
      - name: Atlas tests
        run: dotnet test tests/Jellyfin.Api.Tests --configuration Release --filter AtlasSegmentGrid --verbosity minimal

  web:
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jellyfin/jellyfin-web
          ref: ${{ inputs.web_ref }}
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build jellyfin-web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:production
          git rev-parse --short HEAD > dist/WEB_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-web
          path: web/dist
          retention-days: 1

  server:
    needs: [plan, tests, web]
    if: ${{ always() && needs.plan.outputs.any == 'true' && needs.web.result == 'success' && needs.tests.result != 'failure' && needs.tests.result != 'cancelled' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      # Self-contained: no .NET install needed where it runs.
      - name: Publish server
        run: >
          dotnet publish Jellyfin.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:DebugSymbols=false
          -p:DebugType=none
          --output out/jellyfin

      # Jellyfin serves <app folder>/jellyfin-web by default, so no --webdir needed.
      - uses: actions/download-artifact@v4
        with:
          name: jellyfin-web
          path: out/jellyfin/jellyfin-web

      - name: Stamp build
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "tag=${TAG:-none}"
            echo "server=${GITHUB_SHA::7}"
            echo "web=$(cat out/jellyfin/jellyfin-web/WEB_COMMIT)"
          } > out/jellyfin/ATLAS_BUILD

      # tar keeps the executable bit on macOS/Linux; Windows gets a zip.
      - name: Package
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd out && zip -qr "../atlas-server-${{ matrix.name }}.zip" jellyfin)
          else
            tar -czf "atlas-server-${{ matrix.name }}.tar.gz" -C out jellyfin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-server-${{ matrix.name }}
          path: atlas-server-${{ matrix.name }}.*

  release:
    needs: [server]
    if: ${{ always() && inputs.release_tag != '' && needs.server.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: atlas-server-*
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          name: Atlas Server ${{ inputs.release_tag }}
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Jellyfin server with Atlas ABR, jellyfin-web `${{ inputs.web_ref }}` bundled.
            macOS: `xattr -dr com.apple.quarantine jellyfin` after extracting, then run `./jellyfin/jellyfin --ffmpeg <path to jellyfin-ffmpeg>`.